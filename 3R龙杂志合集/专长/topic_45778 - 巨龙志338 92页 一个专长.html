    <p>
      标题: <b>巨龙志338 92页 一个专长</b>
    </p>
    <p>
      作者: <b>其实</b> 于 <b>2012-02-18, 周六 09:08:25</b>
    </p>
    <p>
      盾矛风格（一般专长）
    </p>
    <p>
      你可以将使用轻盾与一种长杆穿刺长型武器结合起来，比如说长矛或是锥矛（awl pike？）。
    </p>
    <p>
      要求：擅长所选的尖刺长杆武器，擅长轻盾
    </p>
    <p>
      效果：当你使用一个双手长杆穿刺长型武器时你可以使用轻盾并获得它全部的AC加值。
    </p>
    <p>
      正常：当你装备轻盾时你可以在手上持有物品，但你不能用同一只手装备武器。
    </p>
    <p>
      特殊：战士可以选择盾矛风格作为战士职业奖励专长（见玩家手册38页）。
    </p>
  </body>
